[package]
name = "nassi-rs"
version = "0.1.0"
edition = "2021"
description = "Serverless LAN messenger (users list, global chat, private chats, file transfer) - a Rust re-implementation inspired by Network Assistant"
license = "MIT"

[[bin]]
name = "nassi-rs"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_extras = { version = "=0.29.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3.3"
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "bmp", "ico"] }
rfd = "0.15"
dirs = "5"
chrono = "0.4"
arboard = "3"
rand = "0.8"
sha2 = "0.10"
chacha20poly1305 = "0.10"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
